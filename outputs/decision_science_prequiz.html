<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现代决策学 · 前置自测</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1f2430; --sub:#5b6472; --line:#e6e9ef;
    --brand:#2f6fed; --brand-soft:#eaf1ff; --ok:#1a9e6a; --ok-soft:#e8f7f0;
    --warn:#d97706; --warn-soft:#fdf3e3; --err:#dc2626; --err-soft:#fdecec;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.6;}
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 96px;}
  header.top{background:linear-gradient(135deg,#2f6fed,#5b8cf7);color:#fff;border-radius:18px;
    padding:28px 26px;box-shadow:0 8px 24px rgba(47,111,237,.18);}
  header.top h1{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
  header.top p{margin:0;opacity:.92;font-size:13.5px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:12px}
  .legend span{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px}
  .intro{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    margin:18px 0 22px;font-size:13.5px;color:var(--sub)}
  .intro b{color:var(--ink)}
  .mod{margin:26px 0 10px;font-size:15px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;gap:10px}
  .mod::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--brand)}
  .unit{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(20,30,60,.04)}
  .unit-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .unit-t{font-size:15px;font-weight:700}
  .unit-t small{font-weight:600;color:var(--brand);margin-right:8px;background:var(--brand-soft);
    padding:2px 8px;border-radius:8px;font-size:12px}
  .badge{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:20px;white-space:nowrap;
    background:#eef1f6;color:var(--sub)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .goal{font-size:12.5px;color:var(--sub);margin:8px 0 4px}
  .q{padding:14px 0;border-top:1px dashed var(--line);margin-top:12px}
  .q:first-of-type{border-top:none;margin-top:6px}
  .q-t{font-size:14px;font-weight:600;margin-bottom:10px}
  .q-t i{font-style:normal;color:var(--brand);font-weight:700;margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;cursor:pointer;font-size:13.5px;transition:.15s;background:#fff}
  .opt:hover{border-color:#c7d5f5;background:#fafbff}
  .opt input{margin-top:3px;accent-color:var(--brand)}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--err);background:var(--err-soft)}
  .opt .k{font-weight:700;color:var(--sub);min-width:14px}
  .fb{display:none;margin-top:10px;font-size:12.8px;border-radius:10px;padding:10px 12px}
  .fb.show{display:block}
  .fb.right{background:var(--ok-soft);color:#166a4b}
  .fb.wrong{background:var(--err-soft);color:#a12121}
  .fb b{color:inherit}
  .actions{position:sticky;bottom:0;margin-top:26px;background:linear-gradient(180deg,rgba(246,247,249,0),var(--bg) 30%);
    padding:18px 0 6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button{border:none;border-radius:12px;padding:12px 22px;font-size:14.5px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.15s}
  .primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(47,111,237,.28)}
  .primary:hover{background:#255fd6}
  .ghost{background:#fff;color:var(--sub);border:1px solid var(--line)}
  .ghost:hover{border-color:#c7d5f5;color:var(--brand)}
  .result{display:none;margin-top:22px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(20,30,60,.08)}
  .result.show{display:block}
  .result h2{margin:0 0 6px;font-size:18px}
  .score-top{font-size:13.5px;color:var(--sub);margin-bottom:14px}
  .bar{height:10px;border-radius:6px;background:#eef1f6;overflow:hidden;margin:6px 0 14px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#6aa0ff);width:0;transition:.6s}
  .advice{font-size:14px;background:var(--brand-soft);color:#1d4fa8;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .rlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ritem{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 11px;border-radius:10px;background:#f4f6fa}
  .ritem.ok{background:var(--ok-soft)}
  .ritem.warn{background:var(--warn-soft)}
  .ritem .n{color:var(--sub)}
  @media(max-width:560px){.rlist{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>现代决策学 · 前置自测</h1>
    <p>答完每单元的选择题，系统自动判断你是否已掌握，并提示是否需要上这门课。</p>
    <div class="legend">
      <span>✅ 答对率 ≥ 2/3 → 可跳过</span>
      <span>📘 低于 2/3 → 建议学习</span>
    </div>
  </header>

  <div class="intro" id="intro"></div>

  <div id="quiz"></div>

  <div class="actions">
    <button class="primary" id="submit">提交并查看诊断结果</button>
    <button class="ghost" id="reset">重做</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const DATA = {"课程名称": "现代决策学：从认知觉醒到复杂权衡", "用途": "每单元前置自测：用于判断学习者是否已掌握该单元核心概念，从而决定是否需要选修该课。", "设计原则": ["题目全部基于提出该理论或揭示该偏误的真实科学史事件、经典实验或著名原型案例出题，杜绝自编情景导致多概念套用。", "每个选项在长度（字数极差严格控制）、专业术语（严禁正确项专有而干扰项口语化，严禁使用括号）及情绪倾向（全部中立冷静）上绝对拉平。", "彻底摒弃『以下选项最XXX的是』等主观程度比较句式，统一采用客观的现象判定、因果机制推导或边界条件判定；干扰项具有明确的认知偏误或逻辑事实破绽，确保正确答案唯一闭合。", "正确答案在 A/B/C/D 之间均匀分布（A11/B11/C11/D12），且同一单元内三题答案字母完全互不相同。"], "评分规则": {"单题计分": "每题答对得1分，答错得0分。", "单元判定": "每单元答对率 ≥ 2/3（3题答对2题及以上）视为『已掌握』，建议跳过；低于该线视为『建议学习』。", "整卷判定": "全部单元中『建议学习』的单元数 > 5，建议完整学习本课程；3~5 个建议按需补课；≤2 个可按薄弱单元定向学习。"}, "模块": [{"模块编号": "Module 1", "模块名称": "信息免疫力：看清世界本来的样子", "单元": [{"编号": "U1", "名称": "事实、观点与证据链", "通过线": "3题答对≥2题", "题目": [{"id": "U1-Q1", "题干": "1610年伽利略在《星际信使》中记录天体观测，引发与经院哲学的激烈争辩。下列陈述中属于具备主体间性且可被独立复核的客观事实的是：", "选项": {"A": "记录连续多夜观测中木星近旁四颗光点的相对位移数值", "B": "认定宇宙所有天体在本质上均符合完全对称的几何外形", "C": "主张经典经院哲学体系已穷尽天体宏观运转的终极法则", "D": "断定人工磨制透镜必然诱导人类视觉中枢产生虚妄伪影"}, "答案": "A", "考察概念": "事实与观点", "答错说明": "混淆了可观测、可测量的客观经验数据与基于先验教条的主观理论判定。"}, {"id": "U1-Q2", "题干": "大众健康传播中长期流传每日必须饮用八杯水的准则。在针对原始文献的证据链复核中，判定该主张存在信源断章截取的客观依据是：", "选项": {"A": "统计受试群体在增加额外饮水量后机体代谢指标的显著改变", "B": "查证原始指导文件中包含食物已提供大部分水分的关键限定", "C": "对比多国现行膳食指南中关于每日推荐饮水总量的文本差异", "D": "收集受试者长期遵循该饮水模式后疲劳缓解程度的量表数据"}, "答案": "B", "考察概念": "证据等级、信源溯源", "答错说明": "依赖横向观点比对或表象数据验证，而未核查一手文献及其上下文限定条件。"}, {"id": "U1-Q3", "题干": "1967年国际顶级医学期刊发表综述将心血管疾病归咎于脂肪并淡化糖类风险。根据科研伦理与证据审计，判定该文献存在结构性利益冲突的客观事实是：", "选项": {"A": "研究结论在发表后十年内被主流学术界同行引用的总体频次规模", "B": "论文正文图表展现形式与当时流行病学统计制图规范的契合程度", "C": "行业协会秘密全额资助课题研究且论文未进行资金利益相关披露", "D": "论文作者团队在心血管病理领域持有的崇高学术声望与终身教职"}, "答案": "C", "考察概念": "利益冲突、专业边界", "答错说明": "忽视了资助方商业立场的隐蔽渗透，误将学术权威身份或引用规模等同于研究客观中立。"}]}, {"编号": "U2", "名称": "样本盲区与算法茧房", "通过线": "3题答对≥2题", "题目": [{"id": "U2-Q1", "题干": "1936年美国大选前，《文学文摘》依据电话簿与豪车登记册发放千万份问卷，回收230余万份后预测兰登将大胜罗斯福，结果罗斯福以压倒性优势连任；而盖洛普仅抽样数千人便准确预测了选举结果。导致《文学文摘》民调结论失效的核心统计学缺陷是：", "选项": {"A": "抽样框排除了大量低收入群体，导致调研样本严重缺乏代表性。", "B": "问卷回收总量未达选民法定比例，导致统计推论存在极大误差。", "C": "问卷设问带有强烈的引导倾向，诱发了受访群体的顺从性回答。", "D": "调查周期过长导致既有民意逆转，未能捕捉临近投票期的动态。"}, "答案": "A", "考察概念": "选择偏差、抽样框偏倚与代表性样本", "答错说明": "把抽样框本身的系统性阶层偏差，误判为样本量不足、问卷设问诱导或选民民意突变。"}, {"id": "U2-Q2", "题干": "二战期间，盟军统计研究组分析返航轰炸机的受损分布，发现机翼弹孔密集而发动机舱完好，军方提议加固机翼。统计学家沃德力排众议，建议重点加固发动机舱。沃德得出该结论所依据的统计推论是：", "选项": {"A": "机翼受损面积显著大于动力舱，加固非致命部位属于无效防御。", "B": "评估容易受初始观察特征锚定，未建立未受攻击战机基准对照。", "C": "统计样本仅包含成功返航战机，关键要害中弹的飞机早已坠毁。", "D": "防空火力在后续交锋中将校准，既有受损分布会丧失参考价值。"}, "答案": "C", "考察概念": "幸存者偏差、沉默证据与隐形分母", "答错说明": "忽视了未返航飞机构成的隐形分母，将观测样本的选择性截断误归为表面面积对比、心理锚定或未来战术演变。"}, {"id": "U2-Q3", "题干": "学者桑斯坦在《信息乌托邦》中指出，算法个性化推送容易让公众陷入信息茧房与回音室。在社交网络平台中，促成该认知闭环形成的关键算法机制是：", "选项": {"A": "算法优先分发商业变现内容，系统性挤压了严肃议题讨论空间。", "B": "语义识别模型难以解析隐喻，对非主流观点的分类准确率偏低。", "C": "推荐引擎过度侧重即时热点，导致用户对长周期事实感知断裂。", "D": "算法基于互动历史强化同质观点，协同过滤掉立场相左的声音。"}, "答案": "D", "考察概念": "信息茧房、回音室效应与协同过滤算法机制", "答错说明": "未识别出算法基于互动历史进行同质加权与反向过滤的自强化闭环，把信息茧房误归为商业变现、语义识别局限或即时热点偏好。"}]}, {"编号": "U3", "名称": "相关、因果与归因错觉", "通过线": "3题答对≥2题", "题目": [{"id": "U3-Q1", "题干": "20世纪中叶流行病学调查曾发现饮用咖啡者罹患心脏病的比例显著偏高，后经严密对照发现吸烟者往往伴随大量饮用咖啡，控制吸烟变量后该关联随即消失。导致早期推论失真的因果逻辑破绽是：", "选项": {"A": "忽略了同时影响咖啡摄入与心脏病发病的共存混杂变量", "B": "颠倒了心脏病发作与咖啡摄入行为之间的先后因果方向", "C": "误将时间上相继发生的两组独立事件判定为确定因果链", "D": "混淆了两次生理指标监测过程中的随机波动与均值回归"}, "答案": "A", "考察概念": "混杂变量、相关与因果", "答错说明": "未能识别吸烟这一同时影响咖啡摄入与心脏病发病的混杂变量，误将统计相关等同于因果关系。"}, {"id": "U3-Q2", "题干": "丹尼尔·卡尼曼在分析以色列空军飞行训练案例时指出，学员在极佳动作受表扬后退步、失误受痛斥后好转的统计学根源是：", "选项": {"A": "表扬削弱了学员的危机意识，严厉批评提升了操作警惕性", "B": "极端表现受随机扰动影响，后续测试自然向基准均值靠拢", "C": "相邻两次飞行观测间隔过短，无法反映学员真实技能水平", "D": "高强度飞行过度消耗体能，生理状态起伏主导了成绩波动"}, "答案": "B", "考察概念": "均值回归、随机波动", "答错说明": "将极端表现后自然出现的向均值回归现象，错误归因为外部表扬或批评干预产生的直接效果。"}, {"id": "U3-Q3", "题干": "1747年英国海军军医詹姆斯·林德在军舰上开展坏血病试验：挑选病情相近的12名水手同吃同住，分为6组分别给予不同补充剂，唯独食用柑橘组快速康复。该试验能够确立治疗因果关系的核心设计是：", "选项": {"A": "依靠古典医学理论推导出了酸性物质对于坏血病的治疗机理", "B": "详实记录了水手服药之后身体症状由重转轻的时间先后顺序", "C": "依据患病水手在接受救治前后自身症状好转的单一纵向对比", "D": "在基线环境保持一致的前提下同步引入了平行的干预对照组"}, "答案": "D", "考察概念": "对照设计、因果推断", "答错说明": "未能理解确立因果推断必须在控制基线环境的前提下引入平行对照组，以有效排除外部混杂因素与自愈假象。"}]}]}, {"模块编号": "Module 2", "模块名称": "心智与环境：驯服大脑的出厂设置", "单元": [{"编号": "U4", "名称": "直觉陷阱：搜集与评估时的盲区", "通过线": "3题答对≥2题", "题目": [{"id": "U4-Q1", "题干": "1960年认知心理学家彼得·沃森开展“2-4-6”规律发现实验：主试告知给出的三元数组符合某项隐秘规则，要求被试提出新的三元数组进行测试以推导该规则。实际上隐藏规则仅为简单的“任意升序排列”，但绝大多数被试预设“连续偶数递增”等猜想后，持续测试4-6-8或10-12-14等正向数组并获得肯定反馈，却极少提出可能被否定的反向数组进行试错，导致长期陷入误区。该实验揭示的核心认知偏误机制是：", "选项": {"A": "依赖数列表象特征进行局部的经验归纳而系统忽略深层共性", "B": "仅倾向搜寻符合既有假设的正向证据而系统性回避反例证伪", "C": "固守初始呈现数值作为定量评估基准而后续思维调整不充分", "D": "依据生动具体案例的提取容易程度而主观夸大潜在发生概率"}, "答案": "B", "考察概念": "确认偏误、假说检验与证伪原则", "答错说明": "未能识别被试在检验假说时只搜集证实性证据的认知倾向，误将其归因于经验归纳局限、初始数值锚定或案例可得性干扰。"}, {"id": "U4-Q2", "题干": "1974年阿莫斯·特沃斯基与丹尼尔·卡尼曼开展经典实验：让被试旋转一个预先被设定在10或65停下的幸运轮盘，随后要求被试判断联合国中非洲成员国比例是高于还是低于该轮盘数字，并给出具体估计值。结果轮盘停在10的受试组估值中位数为25%，而停在65的受试组估值中位数高达45%。该实验表明任意给出的初始数值扭曲后续定量判断的核心机制是：", "选项": {"A": "极端数值以高度鲜明性占据短期记忆而主导了后续提取概率", "B": "受试群体预设实验线索具备权威关联性而系统放弃独立推论", "C": "初始无关数值充当了思维起步锚点而后续认知调整严重不足", "D": "问题表述的语义框架诱发了得失感知而逆转了个体风险偏好"}, "答案": "C", "考察概念": "锚定效应、启发式偏差与调整不足", "答错说明": "未能理解无关数值充当了评估起步参照点且后续调整显著不足，误将锚定效应归结为记忆可得性、权威线索推论或表述框架反转。"}, {"id": "U4-Q3", "题干": "1981年丹尼尔·卡尼曼与阿莫斯·特沃斯基开展著名的“亚洲疾病问题”实验：假设某种疾病爆发将导致600人丧生。当应对方案表述为“确定救活200人”时，多数受试者倾向选择确定性方案；而当实质完全相同的方案表述为“确定死亡400人”时，绝大多数受试者转而倾向选择具有不确定性的冒险方案。导致受试群体风险偏好发生系统性反转的认知根源是：", "选项": {"A": "受试者对极端偶发概率过度加权导致期望效用评估严重失真", "B": "初始给出的具体伤亡数字充当锚点锁定了后续心智推演区间", "C": "决策者仅关注与直觉预判契合的描述而忽视客观概率的权衡", "D": "表述框架重设心理参照点使收益域规避风险损失域偏好冒险"}, "答案": "D", "考察概念": "框架效应、心理参照点与前景理论", "答错说明": "未能识别不同表述语境通过重设得失参照点系统逆转了风险偏好，误将框架效应混淆为概率加权偏差、数值锚定或确认偏误。"}]}, {"编号": "U5", "名称": "止损的艺术：跨越沉没成本与损失厌恶", "通过线": "3题答对≥2题", "题目": [{"id": "U5-Q1", "题干": "20世纪60至70年代，英法两国联合研发协和式超音速客机。在研发成本严重超支且商业运营已确证无法盈利后，两国决策层仍以“已投入巨资不可半途而废”为由持续追加预算数十年。导致该项目陷入“协和谬误”的核心认知机制是：", "选项": {"A": "将既往不可收回支出视作依据，背离了面向未来边际损益评估。", "B": "低估新技术商业化的周期阻力，未能预判外部能源危机的冲击。", "C": "受制于跨国联合研发权责困境，缺乏及时终止项目的制衡机制。", "D": "过度追求国家旗舰工程的声誉，忽视了民航运营市场客观规律。"}, "答案": "A", "考察概念": "沉没成本谬误与边际决策分析", "答错说明": "未能识别出决策被已经发生且无法收回的历史投入绑架，将沉没成本误当作继续投资的依据，而非基于未来的边际成本与收益做出理性决断。"}, {"id": "U5-Q2", "题干": "卡尼曼与特沃斯基在前景理论研究中设计了经典抛硬币实验：硬币正面朝上输100美元、背面朝上赢100美元，绝大多数受试者坚决拒绝参与；只有当获胜收益提高至200美元以上时，多数人才愿意接受博弈。该实验揭示的核心心理规律是：", "选项": {"A": "个体在面对潜在确定性收益时，更倾向于采取极度保守的策略。", "B": "同等规模损失引发的负向效用，显著高于等量收益的正向效用。", "C": "个体对既有资产产生主观依恋，凭空抬高对其持有物品的估值。", "D": "决策者受直观即时情绪所驱动，系统性高估随机事件发生概率。"}, "答案": "B", "考察概念": "损失厌恶与前景理论价值函数", "答错说明": "未能理解损失厌恶的核心规律，即同等数额的损失带来的负效用心理折损显著大于等量收益带来的正效用，误将其归因于确定性偏好、禀赋效应或情绪概率扭曲。"}, {"id": "U5-Q3", "题干": "1990年理查德·塞勒与卡尼曼等人在康奈尔大学开展经典实验：随机分到马克杯的学生作为卖方，平均最低出价为5.25美元；而未分到杯子的学生作为买方，平均最高出价仅2.25美元。导致买卖双方估值产生显著鸿沟的心理机制是：", "选项": {"A": "买方受到外部参考标价的锚定，系统性压低对非必需品的估价。", "B": "卖方试图补偿获取物品的成本，将沉没支出直接转嫁至出价中。", "C": "拥有权状态诱发个体损失厌恶，显著抬高对已持有物品的估值。", "D": "交易主体因现状偏见产生惰性，本能抗拒打破初始平衡的交换。"}, "答案": "C", "考察概念": "禀赋效应与拥有权心理机制", "答错说明": "未能识别拥有权本身会触发损失厌恶并凭空抬高物品估值的“禀赋效应”，误将卖方的高要价归因为外部价格锚定、沉没成本转嫁或现状交易惰性。"}]}, {"编号": "U6", "名称": "冷热状态与选择架构（Nudge）", "通过线": "3题答对≥2题", "题目": [{"id": "U6-Q1", "题干": "行为经济学家乔治·勒温斯坦在冷热共情差距的经典实验中发现，受试者在冷静饱腹时制订节食方案表现得极具信心，在面临实际饥饿时却普遍失控违背初衷。该实验揭示的核心认知规律是：", "选项": {"A": "冷静状态下的个体系统性低估了内脏冲动对自我控制的瓦解程度", "B": "饱腹状态下的个体系统性高估了未来饥饿诱惑对行为的干扰强度", "C": "节食方案的执行受挫主要源于个体对食物热量摄入缺乏精准计算", "D": "饥饿状态下的生理冲动使得个体认知系统完全丧失长期规划能力"}, "答案": "A", "考察概念": "冷热共情差距、决策冲动与意志力错觉", "答错说明": "未识别出冷热共情差距的认知不对称性，误将人在热状态下的决策失控归因为信息计算失误、诱惑强度预判反向偏误或大脑认知功能彻底崩溃。"}, {"id": "U6-Q2", "题干": "20世纪60年代英国将含有一氧化碳的剧毒煤气全面替换为无毒天然气。该举措在未改善公众整体心理健康水平的前提下，使全国自杀总人数长期下降超三成且未引发其他手段替代。该历史案例证实的核心决策规律是：", "选项": {"A": "特定行为途径受阻后个体必然会积极寻求等效替代方案达成目标", "B": "微调外部物理环境无法扭转由内在心理状态主导的长期行为倾向", "C": "提升行为实施的物理摩擦力能够有效阻断非理性决策的即时执行", "D": "普及潜在危害认知是促使群体自发放弃危险决策行为的根本前提"}, "答案": "C", "考察概念": "摩擦力设计、情境预防与冲动阻断", "答错说明": "忽视了物理摩擦力对热状态下冲动决策的关键阻断作用，陷入了手段替代必然发生、纯内在动机决定论或单纯依赖认知说服的误区。"}, {"id": "U6-Q3", "题干": "2003年埃里克·约翰逊与丹尼尔·戈德斯坦在《科学》发表关于欧洲多国器官捐献的研究指出，需要主动登记加入的德国与丹麦登记率仅约百分之十五，而预设默认加入且需主动声明才退出的奥地利与法国登记率超过百分之九十九。导致这一悬殊差异的核心机制是：", "选项": {"A": "各国公民在利他主义奉献精神与道德认同水平上存在本质性差距", "B": "公共医疗救治技术水平与透明机制决定了公众参与捐献的信任度", "C": "国家法律强制惩戒措施的严厉程度直接规制了个体公民的选择权", "D": "预设默认选项利用决策惯性与认知阻力锁定了绝大多数选择结果"}, "答案": "D", "考察概念": "助推、默认选项与选择架构", "答错说明": "把选择架构中默认选项带来的行为惯性与认知阻力机制，错误归因为国民道德水平、医疗透明信任度或法律强制力等外部宏观因素。"}]}]}, {"模块编号": "Module 3", "模块名称": "概率与不对称风险：在迷雾中下注", "单元": [{"编号": "U7", "名称": "基准率与贝叶斯更新", "通过线": "3题答对≥2题", "题目": [{"id": "U7-Q1", "题干": "1972年丹尼尔·卡尼曼与阿莫斯·特沃斯基在经典出租车实验中指出：某城出租车中85%为绿色、15%为蓝色。夜间肇事逃逸案的目击证人指认肇事车为蓝色，其实验室辨识准确率为80%。多数受试者判定肇事车为蓝色的概率为80%，而依据贝叶斯定理推导实际仅约41%。受试者产生这一系统性认知偏差的核心机制是：", "选项": {"A": "过度聚焦个案证词的似然性证据，系统性忽略了总体背景的基础概率", "B": "错误假定目击证人的感官辨识能力，在夜间低能见度环境下面临衰减", "C": "误将两次独立观测结果相混淆关联，陷入了小数定律与均值回归偏差", "D": "混淆了先验分布与主观效用权重，放大了极端小概率事件的危险程度"}, "答案": "A", "考察概念": "基准率忽略、似然性证据与先验概率", "答错说明": "未能识别决策者在面对具体个案线索时容易完全忽视总体大盘概率的基准率忽略偏差，误将认知偏差归因为外界感官退化、均值回归或效用主观加权。"}, {"id": "U7-Q2", "题干": "1982年大卫·埃迪在临床医学决策研究中指出：某罕见病在无症状人群中的基准患病率为0.1%，筛查试剂的灵敏度与特异度均为99%。当一名受检者初筛结果呈阳性时，依据贝叶斯定理推导其实际患病概率仅约9%，但近九成受访医生却断言其患病概率高达90%以上。导致受访医生出现严重判断失误的核心机制是：", "选项": {"A": "误将多次独立试验的统计规律关联，陷入了赌徒谬误与均值回归误区", "B": "混淆了受检者患病时的检测阳性概率，与检测阳性时的实际患病概率", "C": "因生动个案触发可得性启发式偏差，主观放大了罕见病发病危险程度", "D": "受合取谬误影响错误判定复合病症，联合发生概率高于单项病症概率"}, "答案": "B", "考察概念": "贝叶斯更新、条件概率混淆与假阳性反直觉", "答错说明": "未能理解条件概率的方向性差异，混淆了似然度与后验概率，将患病前提下的阳性率错误等同于阳性前提下的患病率，而未将其归因于其他概率谬误。"}, {"id": "U7-Q3", "题干": "德国认知科学家盖德·吉仁泽在临床决策与司法统计研究中发现：当用“每1000人中有10人患病且其中8人呈阳性、未患病的990人中有99人呈阳性”等自然频数表述，替代抽象的条件概率百分比时，专业人员推断后验概率的准确率大幅跃升。自然频数能够有效消除概率认知遮蔽的核心原因是：", "选项": {"A": "彻底消除了临床检测过程中的系统误差，规避了小样本随机抽样噪音", "B": "将概率推断简化为确定性单向因果逻辑，规避了风险评估的不确定性", "C": "促使决策者对新输入证据做二元是非判定，排除了置信区间动态扰动", "D": "将抽象条件概率转化为具体的发生人次，直接保留了先验基准率信息"}, "答案": "D", "考察概念": "自然频数、信息表征架构与贝叶斯置信度更新", "答错说明": "忽视了自然频数的核心优势在于通过具体的联合频数天然承载了先验基准率，消除了抽象乘法与归一化计算门槛，误将其理解为消除客观测量误差、消解不确定性或强化非黑即白的极端跳跃。"}]}, {"编号": "U8", "名称": "期望值、赔率与尾部风险", "通过线": "3题答对≥2题", "题目": [{"id": "U8-Q1", "题干": "纳西姆·塔勒布在《随机漫步的傻瓜》中提出著名的俄罗斯轮盘赌思维实验：假设左轮手枪六个弹巢中仅装有一颗子弹，参与者扣动一次扳机有六分之五的概率获得巨额奖金，六分之一的概率中弹丧命。尽管该博弈单次计算的数学期望值显著为正，但在严密的决策分析中该赌局被绝对否决。导致数学期望值在此失效的根本逻辑是：", "选项": {"A": "统计胜率与单次结果间存在随机波动导致最终收益无法被预期", "B": "致命性下行尾部风险具有不可逆性直接摧毁后续所有存续可能", "C": "边际效用递减机制使得高额奖金收益无法完全弥补其潜在损失", "D": "样本量匮乏使得大数定律无法在单次离散事件中实现均值收敛"}, "答案": "B", "考察概念": "尾部风险、破产风险与生存底线", "答错说明": "未能识别不可逆破产风险对期望值计算的前提颠覆，误将绝对拒绝博弈的原因归结为统计波动、边际效用递减或大数定律未起作用。"}, {"id": "U8-Q2", "题干": "物理学家奥勒·彼得斯在论证遍历性破缺时提出经典硬币博弈：抛出正面本金增加百分之五十，抛出反面本金减少百分之四十。若一百人同时各掷一次，群体空间平均收益呈现显著增长；若由同一人连续掷一百次，个人资产的时间平均结果却必然走向归零毁灭。导致空间平均与时间平均出现根本分歧的机制是：", "选项": {"A": "群体样本充分满足大数定律而单人连续序列未达到统计收敛界限", "B": "各次独立抛掷的随机扰动使得单人长期收益必然回归理论期望值", "C": "单人时间序列存在路径依赖产生复利回撤而群体各样本彼此独立", "D": "连续下注引发的损失厌恶情绪系统性破坏了理性决策的执行准则"}, "答案": "C", "考察概念": "遍历性破缺、时间平均与空间平均、复利路径依赖", "答错说明": "混淆了群体静态空间平均与个人动态时间平均的本质差异，未能理解单人在乘法过程中的路径依赖与复利回撤，误将其归因于样本量不足、均值回归或情绪偏差。"}, {"id": "U8-Q3", "题干": "1998年由诺贝尔经济学奖得主领衔的华尔街长期资本管理公司，基于严密量化模型利用高倍杠杆捕捉债券市场微弱利差套利，连续数年获取高额收益；但在俄罗斯主权债务违约的极端黑天鹅事件冲击下，数周内迅速遭遇毁灭性崩盘。该经典金融史案例证实的核心决策结构原则是：", "选项": {"A": "依赖历史回测修正量化模型即可精准预判并规避极端尾部冲击", "B": "通过跨市场分散配置资产即可在高杠杆下彻底消除系统性风险", "C": "利用高倍杠杆放大确定性微弱利差是穿越周期的稳健策略选择", "D": "构建下行损失严格封顶而上行收益充分开放的非对称安全边际"}, "答案": "D", "考察概念": "非对称收益、杠杆尾部风险与安全边际", "答错说明": "未能认识到极端尾部风险在杠杆放大下的致命毁灭性，忽视了下行严格封顶的安全边际价值，误以为靠参数优化、表面分散配置或放大杠杆利差能对抗黑天鹅。"}]}, {"编号": "U9", "名称": "校准训练：克服过度自信", "通过线": "3题答对≥2题", "题目": [{"id": "U9-Q1", "题干": "1957年悉尼歌剧院工程开工时原定预算700万澳元并计划1963年完工，最终历经多次方案调整直至1973年才竣工，实际耗资达1.02亿澳元，工期延误十年且超支逾十四倍。丹尼尔·卡尼曼等学者将此类现象归结为典型的规划谬误。决策者在评估项目时陷入该认知陷阱的核心机制是：", "选项": {"A": "评估者过度聚焦于理想执行路径而系统低估不可预见的意外阻力", "B": "承建方为获取立项竞标资格而蓄意隐匿潜在开销进行策略性低报", "C": "复杂工程涵盖超量未定干扰变量而在客观物理维度完全无法预测", "D": "出资方在项目执行中途持续追加功能指标而倒逼成本线不断重设"}, "答案": "A", "考察概念": "规划谬误、过度自信与内部视角", "答错说明": "未能识别规划谬误源于聚焦理想路径而忽视意外阻力的系统性认知偏差，误将其归因于承建方策略性瞒报、客观环境不可预测或出资方中途追加需求。"}, {"id": "U9-Q2", "题干": "20世纪70年代萨拉·利希滕斯坦与巴鲁克·菲施霍夫等学者开展系列校准实验：要求受试者对未知常识数值给出90%置信区间，即确保真实数值有90%的概率落在给定的上下限之间。统计结果显示，受试者声称具备90%确定性的估计区间，实际命中率普遍仅为30%至50%。该经典实验直接证实的认知规律是：", "选项": {"A": "受试群体仅偏好检索验证性证据而刻意忽视反常识边缘数值", "B": "个体普遍高估自身认知精确度而给出了过窄的容错估计范围", "C": "被试群体缺乏专业统计学背景而误将样本极值视作总体均值", "D": "极端罕见数值的生动表象占据短期记忆而诱发概率高估偏差"}, "答案": "B", "考察概念": "过度自信、过度精确与置信区间校准", "答错说明": "未能识别受试者因高估自身认知精确度而导致置信区间过窄的过度自信偏误，误将其归因于确认偏误、统计背景匮乏或可得性启发式偏差。"}, {"id": "U9-Q3", "题干": "丹尼尔·卡尼曼在《思考，快与慢》中记录了一次课程编写经历：编写团队根据当前的教案进度，乐观预测仅需一至两年即可完工；但当卡尼曼向资深专家询问同类课程编撰的历史分布数据时，专家指出类似团队平均耗时七年且有四成团队彻底放弃。要克服此类基于内部视角的预测偏差，对项目可行性进行客观校准的核心依据是：", "选项": {"A": "将微观执行环节拆解至具体日程以强化各阶段推进的确定性", "B": "设定更为严苛的截止期限以通过时间压力倒逼团队执行效率", "C": "引入同类项目历史基准分布数据以客观测算耗时与淘汰概率", "D": "建立高频日常工作进度追踪机制以实时监控任务完成度差距"}, "答案": "C", "考察概念": "外部视角、基准比率与参考类别预测", "答错说明": "未能理解克服内部视角必须依赖同类项目的客观历史基准分布数据，误以为可以通过拆解微观日程、施加截止期压力或高频进度追踪来消除预测偏差。"}]}]}, {"模块编号": "Module 4", "模块名称": "权衡、试验与敏捷行动：破解两难困境", "单元": [{"编号": "U10", "名称": "机会成本与多目标价值权衡", "通过线": "3题答对≥2题", "题目": [{"id": "U10-Q1", "题干": "1850年法国经济学家弗雷德里克·巴斯夏在《看得见的与看不见的》中提出著名的“破窗谬误”：顽童砸碎面包店橱窗，围观者认为这带来了六法郎的修缮开销，进而刺激玻璃工就业并拉动货币流转；巴斯夏指出这忽视了店主本可用这笔款项购置鞋履或书籍。从决策与经济机制审视，破窗论证之所以陷入逻辑谬误，其根本症结在于：", "选项": {"A": "仅核算显性支出的局部流转而忽略资源投向替代用途的隐性代价", "B": "假定封闭系统内的货币循环加速能直接驱动全社会真实财富增长", "C": "将存量实物资产的损耗重置等同于社会生产性资本的实质性扩张", "D": "视无端消耗的劳力要素投入为衡量社会真实福利水平的有效依据"}, "答案": "A", "考察概念": "机会成本、看得见的与看不见的、隐性代价", "答错说明": "未能识别破窗谬误源于忽视了资源投向其他替代用途所放弃的隐性机会成本，误将其归因于货币流通假设、资本形态混淆或福利评估指标偏差。"}, {"id": "U10-Q2", "题干": "经济学中的蒙代尔-克鲁格曼三元悖论指出资本自由流动、汇率稳定与货币政策独立性不可兼得，该不可能性定理深刻映射于多目标价值权衡领域：资产配置中的高收益、高流动性与本金绝对安全构成经典的不可能三角。从多目标决策与帕累托有效前沿的逻辑边界审视，理性决策者处理冲突目标的根本准则是：", "选项": {"A": "试图通过技术创新在单一方案中同时实现所有互斥目标的最大化", "B": "假定提升信息获取与计算精度即可彻底消除各目标间的排他冲突", "C": "厘清各维目标在帕累托前沿上的替代边界并确立不可妥协的底线", "D": "视多维目标冲突为无序博弈而采取随机折中策略规避实质性权衡"}, "答案": "C", "考察概念": "多目标决策、帕累托前沿、不可能三角、底线约束", "答错说明": "未能识别不可能三角在帕累托有效前沿上的结构性权衡本质，忽视了建立优先级与底线约束的必要性，误以为依靠技术创新能消除互斥、依靠算法精度能回避取舍或应当采取无序折中。"}, {"id": "U10-Q3", "题干": "1971年诺贝尔经济学奖得主赫伯特·西蒙提出著名论断：信息所消耗的是接收者的注意力，因此信息的过度丰富必然导致注意力的稀缺。在商业与日常决策中，面对大量零元免费商品与低价促销信息的诱惑，个体往往深陷其中而未察觉实际代价。基于西蒙注意力稀缺与隐性成本理论审视，免费机制对决策者造成的根本资源损耗是：", "选项": {"A": "误判低价商品的物理损耗速度而承担过高的后续维修与重置开销", "B": "忽视服务协议中的排他让渡条款导致个人信息与隐私权益被侵蚀", "C": "受商家的诱导性促销策略影响而无序透支短期内的直接货币预算", "D": "将具有高度稀缺性的时间与认知带宽无形置换为低效的微小收益"}, "答案": "D", "考察概念": "注意力稀缺、隐形成本、机会成本", "答错说明": "误将免费代价局限在物理质量折损、个人隐私外泄或直接货币诱导透支等可见维度，忽视了时间和认知注意力这类不可再生稀缺资源的巨大隐性置换成本。"}]}, {"编号": "U11", "名称": "可逆性、信息价值与小步试验", "通过线": "3题答对≥2题", "题目": [{"id": "U11-Q1", "题干": "杰夫·贝佐斯在1997年以来的亚马逊致股东信中提出著名的决策分类模型：将不可逆且后果深远的事项定义为第一类单向门决策，将高度可逆且便于修正的事项定义为第二类双向门决策。贝佐斯指出大型组织最常见的系统性决策失效，是对双向门决策过度套用沉重的单向门审批研判流程。依据该分类模型，实现组织高效敏捷运转的核心治理机制是：", "选项": {"A": "对可逆事项充分下放权限小步试错而对不可逆决策保持审慎研判", "B": "对所有经营决策实施严格层级审批以消除执行过程中的试错风险", "C": "对不可逆重大决策持续追加信息搜集以期彻底消除外部不确定性", "D": "对所有决策类型全面实行去中心化放权以达成全局步调快速推进"}, "答案": "A", "考察概念": "单向门与双向门、决策可逆性、分析瘫痪与速度权衡", "答错说明": "未能理解决策可逆性对组织授权与速度的关键意义，误以为应全面实行官僚审批以消除试错风险、通过无限搜集信息强行消除不可逆性，或是无差别彻底放权而忽视不可逆重大决策的审慎研判。"}, {"id": "U11-Q2", "题干": "1999年鞋类电商Zappos创始人尼克·斯威姆恩为验证消费者线上购鞋意愿，并未提前投入巨资自建仓储、采购库存与开发物流系统，而是前往本地实体鞋店拍下鞋款照片上传至简陋网页；一旦产生真实订单，便直接去实体店原价买下打包寄出。从最小可行性试验的决策逻辑分析，该做法的核心价值在于：", "选项": {"A": "通过提前搭建重资产供应链以确保全流程履约具备规模盈利能力", "B": "通过极小沉没成本验证真实支付意愿以排除市场伪需求根本风险", "C": "通过实体店原价采买赚取微薄进销差价以维持早期业务自我造血", "D": "通过长期维持人工采购的极简模式以彻底规避规模扩张管理负荷"}, "答案": "B", "考察概念": "最小可行性试验、信息价值与真实行为验证", "答错说明": "未能识别最小可行性试验的核心在于用极低沉没成本验证真实支付意愿与核心需求假设，误以为应过早投入重资产搭建供应链、误将零售原价履约当做赚取差价的盈利模型，或误将其视作规避组织扩张的永久运营方式。"}, {"id": "U11-Q3", "题干": "在珠穆朗玛峰高海拔攀登中存在著名的下午两点登顶铁律：无论当时距离顶峰还剩多少米、天气看起来多么良好，只要未在下午两点前登顶，所有队员必须立刻无条件折返下撤。从行为决策与风险控制视角来看，确立该项事前止损规则的核心机制是：", "选项": {"A": "依据现场即时体能与局部气象动态调整行动以捕捉潜在登顶机会", "B": "依据前期沉没成本与剩余登顶距离灵活顺延预设的最后折返时限", "C": "依据现场团队民主表决形成的共识消除决策分歧以凝聚冲顶意愿", "D": "依据事前冷状态设立的刚性规则以阻断现场冲动诱发的承诺升级"}, "答案": "D", "考察概念": "预设停止规则、冷热状态脱节、沉没成本与承诺升级", "答错说明": "未能理解事前停止规则是用冷状态下的刚性契约克服现场情绪冲动、沉没成本与承诺升级陷阱，误以为应在极端热状态下依赖即时体能和气象评估微调、基于已投入的沉没成本顺延时限，或试图通过现场民主表决妥协安全底线。"}]}]}, {"模块编号": "Module 5", "模块名称": "博弈、群策与人机协同：在复杂系统中进化", "单元": [{"编号": "U12", "名称": "策略互动与博弈思维", "通过线": "3题答对≥2题", "题目": [{"id": "U12-Q1", "题干": "在单次囚徒困境或剧场效应中，参与者追求个体最优往往诱发集体非理性并陷入双输困境。1980年罗伯特·阿克塞尔罗德举办重复囚徒困境计算机锦标赛，汇集全球学者提交的策略程序进行循环博弈，最终极其简洁的“以牙还牙”策略夺得总分第一。该策略能够打破背叛僵局并促成长期正和合作的关键机制是：", "选项": {"A": "依靠率先发起背叛以剥夺对手存续筹码从而确立绝对收益优势", "B": "首轮主动合作且对背叛即时惩罚并在对方重新合作时迅速宽容", "C": "借助随机扰动隐藏真实行动轨迹以防止对手推断自身行为模式", "D": "无论对手采取何种策略均无条件维持合作以感化对方协同行动"}, "答案": "B", "考察概念": "囚徒困境、重复博弈、正和博弈与以牙还牙策略", "答错说明": "未能理解重复博弈中促成合作的关键在于善意先发、即时报复背叛与迅速宽容的确定性机制，误以为单方面掠夺、随机不可测或无底线妥协能够维持长期合作。"}, {"id": "U12-Q2", "题干": "18世纪末英国政府向澳大利亚流放犯人。早期政府按登船人数向私营船主预付全额运费，导致船主克扣口粮药品，犯人航运死亡率长期超过30%；后经埃德温·查德威克等建议进行制度改革，运费变更为只有罪犯活着走下澳大利亚码头才予以结算，犯人存活率随即跃升至98%以上。该制度改革能够彻底扭转危机的关键机制是：", "选项": {"A": "通过强化官方道德倡导与司法惩戒威慑从外部约束私人船长行为", "B": "借助引入第三方独立医疗监理机构对航行过程实施全程封闭监督", "C": "将承运船长的自利动机与犯人生存目标紧密绑定以实现激励相容", "D": "提高单次航运的预付保证金比例以抵押赔偿航程中的非正常损耗"}, "答案": "C", "考察概念": "激励相容、机制设计与信息不对称", "答错说明": "未能理解机制设计的核心在于重塑利益分配规则以实现自利与全局目标的激励相容，误以为依赖道德说教、行政监督或前置押金能够解决委托代理危机。"}, {"id": "U12-Q3", "题干": "在博弈论与机制设计理论中，“一人切蛋糕、另一人优先选”是解决双人分配争端的经典基准规则。即使在双方缺乏信任且完全自利的极端前提下，该规则依然能够自发达成令双方均无异议的公平分割。该机制能够彻底消除分配嫉妒的博弈逻辑是：", "选项": {"A": "依靠双方对公序良俗的道德共识在博弈中自发克制自私索取冲动", "B": "切分主体精湛的操作技能能够确保物理分割层面达成绝对对称性", "C": "优先挑选方的利他心理促使其在选择时主动兼顾切分主体的利益", "D": "切分主体预判对方必选较大份额因而在自利驱动下竭力做到均等"}, "答案": "D", "考察概念": "无嫉妒分割、逆向归纳与机制设计", "答错说明": "未能认识到分蛋糕机制是通过将挑选权让渡给对方，利用切分者的自利本能倒逼其主动追求均等，误将公平的实现归因于道德约束、精湛技术或利他心理。"}]}, {"编号": "U13", "名称": "群体盲区与高效群策机制", "通过线": "3题答对≥2题", "题目": [{"id": "U13-Q1", "题干": "1961年美国肯尼迪政府策划入侵古巴的“猪湾事件”，内阁决策团队汇集了顶尖智囊与国家安全精英，但在凝聚力极高且领导者已定调的封闭氛围中，参谋人员主动压制并自我审查怀疑异见，最终全票通过了漏洞百出的行动计划并遭遇全军覆没惨败。心理学家欧文·贾尼斯据此提出了群体思维理论。导致该精英团队决策灾难的深层动力学机制是：", "选项": {"A": "群体高凝聚力促使成员为维持表面和谐而主动压制异见与质疑", "B": "决策团队成员普遍缺乏跨学科背景与地缘军事博弈的基本常识", "C": "敌对阵营故意释放虚假战术情报全面瘫痪了决策层的侦察系统", "D": "指挥层级过于繁琐冗长致使前方登陆部队错失了最佳突击战机"}, "答案": "A", "考察概念": "群体思维、自我审查、群体凝聚力与一致性幻觉", "答错说明": "未能识别群体思维的核心机制在于团队内部高凝聚力与从众压力诱发的自我审查与一致性幻觉，误将系统性决策盲区归因于成员专业素养不足、外部敌对欺骗或战术指挥层级冗长。"}, {"id": "U13-Q2", "题干": "1974年管理学者杰里·哈维在德克萨斯州度过40多度酷暑的下午，岳父提议驱车往返80多公里去阿比林吃难吃快餐，妻子、女婿与岳母因误以为他人赞成且不愿扫兴而全员附和同意；最终在酷暑颠簸与疲惫后，众人发现所有人原本都希望留在家里吹风扇。哈维据此提出“阿比林悖论”，该悖论揭示的集体决策失效根源是：", "选项": {"A": "群体内部不同成员之间存在根本无法妥协调和的口味与作息偏好", "B": "核心提议者凭借家庭长辈身份实施家长制专断并强行推行其主张", "C": "成员误判他人的真实偏好且为顺应虚构共识而违心表达附和支持", "D": "全体成员在出发前缺乏对实际行车路况与就餐环境的前置化调研"}, "答案": "C", "考察概念": "阿比林悖论、虚假共识、同意管理失效", "答错说明": "未能识别阿比林悖论的核心在于“无法管理同意”——每个成员均误判了群体他人的意愿，并为迎合虚构的共识而违背自身真实想法，误将其归因于利益不可调和、家长专制或行前调研不足。"}, {"id": "U13-Q3", "题干": "1951年所罗门·阿希设计经典线段判断实验，在多名协同伪装的托儿故意给出明显错误答案的压力下，超过75%的受试者至少出现了一次盲目顺从群体的错误判断。为防范自由讨论中因首发观点锚定与从众压力引发的群体盲区，名义小组技术采取的制度化应对流程是：", "选项": {"A": "由会议组织者指定权威专家率先开篇定调从而统一全员认知基准", "B": "鼓励所有参会人员在完全自由无约束的即兴研讨中直接碰撞想法", "C": "在方案提出之初立即组织全员进行少数服从多数的公开举手表决", "D": "要求成员先独立匿名书写观点并无偏展示而后再展开讨论与评价"}, "答案": "D", "考察概念": "从众效应、阿希实验、名义小组技术、防盲从群策流程", "答错说明": "未能理解名义小组技术的核心在于通过“先独立匿名静默书写、再汇总无偏呈现”的制度化程序阻断权威锚定与从众压力，误以为专家率先定调、自由即兴讨论或过早举手表决能解决从众偏误。"}]}, {"编号": "U14", "名称": "AI时代的协同决策", "通过线": "3题答对≥2题", "题目": [{"id": "U14-Q1", "题干": "1997年国际象棋世界冠军加里·卡斯帕罗夫败给IBM超级计算机深蓝后，于次年创立了允许人机结对参赛的半人马国际象棋。在随后的自由风格锦标赛中，由两名业余棋手操控三台普通电脑组成的半人马战队，出人意料地击败了纯顶级特级大师和单纯依赖超强算力的超级计算机。从人机协同与复杂决策的耦合机制分析，半人马战队克敌制胜的核心逻辑在于：", "选项": {"A": "以人类战略意图与大局观引导机器进行深度算力穷举与战术验算", "B": "完全依赖大师直觉经验定夺走法而机器仅用于常规棋谱信息检索", "C": "完全将推演决策委托给高算力引擎而人类仅充当形式化确认工具", "D": "引入多套异构算法系统通过无加权投票机制自动达成各走法折中"}, "答案": "A", "考察概念": "半人马模型、人机协同分工、机器算力与人类大局观", "答错说明": "未能理解半人马模型中人类大局观战略引导与机器深度计算穷举的互补共生本质，误将AI单纯降格为信息检索库、彻底交出自主判断沦为机械执行者，或以为多系统盲目投票折中能替代深层协同。"}, {"id": "U14-Q2", "题干": "1972年美国东方航空401号航班在迈阿密进近降落时，机组三名资深飞行员全神贯注于检查一个疑似烧坏的起落架指示灯泡，无人察觉自动驾驶仪已被意外触碰而断开高度保持；因过度信赖自动化巡航托管且未听到异常警报，全机最终在无预警状态下缓缓坠入沼泽。从行为决策与人机交互视阈审视，导致机组发生致命情境意识丧失的认知偏误机制是：", "选项": {"A": "将硬件偶发机械故障视作不可抗力并归因于事故发生的根本诱因", "B": "假定自动化托管绝对可靠而放弃对底层物理仪表的独立交叉核验", "C": "归咎于资深飞行人员技能退化并在排障高压下发生严重认知视盲", "D": "视系统警报过于频繁引发警报疲劳进而造成对异常信号主动忽略"}, "答案": "B", "考察概念": "自动化偏见、情境意识丧失、过度信赖与独立交叉核验", "答错说明": "未能识别自动化偏见源于对自动化系统的盲目信赖与沉默认可，从而放弃了对底层关键客观事实的独立交叉验证；误将其归咎于机械硬件的偶发故障、单向度的人员技能退化，或是高频假警报引发的警报疲劳。"}, {"id": "U14-Q3", "题干": "现代前沿人工智能实验室在研发与部署大模型时，普遍引入标准对抗性红队测试机制：红队不充当方案的终审裁判，而是专门模拟极端攻击视角、诱导性边界条件与对抗性提示词，对系统进行全方位漏洞扫描与压力测试。从人机协同推演与责任伦理视阈审视，红队测试流程在辅助复杂方案制定时的核心定位是：", "选项": {"A": "将算法视作中立裁决法官并由技术模型分担最终决策的法律责任", "B": "以多套模型输出的一致性共识作为人类免除决策失误的合规依据", "C": "由人类决策者与算法模型对复杂推演失误实行对半均摊责任机制", "D": "将算法视作压力测试的对抗参谋而最终价值裁决与责任归属人类"}, "答案": "D", "考察概念": "AI红队测试、决策责任归属、人机对抗推演与伦理边界", "答错说明": "未能理解AI红队测试是将算法作为专门暴露盲区与极端风险的对抗性参谋，误以为算法模型能够成为分担法律与伦理责任的裁决者、借多模型共识免除人类决策失误，或试图在人机之间均摊不可让渡的最终决策权责。"}]}, {"编号": "U15", "名称": "事前验尸与无责复盘系统", "通过线": "3题答对≥2题", "题目": [{"id": "U15-Q1", "题干": "1989年认知心理学家加里·克莱因提出事前验尸决策法：在重大项目正式启动前夕，召集全体参与者宣布假设方案在一年后遭遇了灾难性溃败，要求每人独立写下导致其死亡的具体原因。从行为决策与群体动力学机制审视，该方法打破团队过度乐观与群体迷思的核心逻辑在于：", "选项": {"A": "提前构建防御性心理预期以缓冲未来方案受挫时的团队士气打击", "B": "将方案彻底失败设为既成事实以赋予异见合法性并破除过度乐观", "C": "在行动前排查各环节责任归属以实现后续业务受挫时的精准追责", "D": "借助多方匿名投票表决机制以全盘推翻既定方案并遴选替代路径"}, "答案": "B", "考察概念": "事前验尸、群体迷思、过度乐观与异见合法化", "答错说明": "未能理解事前验尸的核心是通过将失败假定为既成事实，合法化异见表达并倒逼团队排查隐蔽漏洞，误将其视作心理防御缓冲、事前责任切分追责机制或推翻方案的投票表决手段。"}, {"id": "U15-Q2", "题干": "1975年心理学家巴鲁克·菲施霍夫开展关于1972年尼克松访华与访苏前景预测的经典实验：受试者在出访前对各种可能结局预估概率；事后获知真实结果的受试者在回忆初始估计时，系统性地大幅拔高了对已发生事件的预估数值。该实验所揭示的后见之明偏差，其深层认知机制在于：", "选项": {"A": "受试者为维护专业形象而刻意伪造记忆以契合已公开的客观事实", "B": "潜意识在前瞻研判中捕获了潜在决定性线索因而具备真实预见性", "C": "获知结果后无意识地重构认知线索从而高估了事前判断的确定性", "D": "长时间跨度导致的记忆自然衰减使受试者无法精确提取数值记录"}, "答案": "C", "考察概念": "后见之明偏差、认知重构、蠕变决定论与记忆扭曲", "答错说明": "未能识别后见之明偏差源于获知结果后无意识地自动化重构记忆与因果线索，误将其归因于有意维护面子的主观伪造、误信其具备真实的直觉预见性，或误当作无方向性的记忆自然遗忘衰减。"}, {"id": "U15-Q3", "题干": "1988年乔纳森·男爵与约翰·赫什开展关于医疗风险抉择的经典实验：向受试者呈现完全相同的病例数据与手术风险概率测算；当告知手术成功患者康复时，受试者高度赞誉决策严谨明智；而告知患者死于已知的小概率并发症时，受试者则严厉谴责决策轻率愚蠢。从决策质量评估与防范结果偏见的视角审视，评定决策优劣的客观基准在于：", "选项": {"A": "以最终交付成果是否达到预期指标作为裁量决策成败的唯一依据", "B": "依据事后出现的不利结局反推执行流程并推定必然存在人为过失", "C": "综合各利益相关方在尘埃落定后达成的情绪共识以判定方案优劣", "D": "基于做出决定时掌握的信息与风险权衡过程而非偶发的外生结果"}, "答案": "D", "考察概念": "结果偏见、过程与结果分离、决策质量评估与随机性", "答错说明": "未能认识到决策质量应严格取决于决策当时的信息完备度与权衡逻辑，误将不可控的随机结果作为评价标准的倒推依据，陷入以成败论英雄的结果偏见与后见归咎陷阱。"}]}]}]};
const KEY = ["A","B","C","D"];

document.getElementById("intro").innerHTML =
  "<b>课程：</b>" + DATA["课程名称"] + "　|　<b>共 " + DATA.模块.length + " 个模块、" +
  DATA.模块.reduce((n,m)=>n+m.单元.length,0) + " 个单元</b><br>" +
  DATA.评分规则.单元判定;

const quiz = document.getElementById("quiz");
DATA.模块.forEach(mod=>{
  const h = document.createElement("div");
  h.className = "mod"; h.textContent = mod.模块编号 + "　" + mod.模块名称;
  quiz.appendChild(h);
  mod.单元.forEach(u=>{
    const box = document.createElement("div");
    box.className = "unit";
    box.dataset.unit = u.编号;
    box.innerHTML =
      '<div class="unit-h"><div class="unit-t"><small>'+u.编号+'</small>'+u.名称+'</div>'+
      '<span class="badge" data-badge>未作答</span></div>'+
      '<div class="goal">通过线：'+u.通过线+'　·　考察目标：'+(u.题目.map(q=>q.考察概念).filter((v,i,a)=>a.indexOf(v)===i).join("、"))+'</div>';
    u.题目.forEach((q,qi)=>{
      const qd = document.createElement("div");
      qd.className = "q";
      qd.dataset.qid = q.id;
      qd.dataset.answer = q.答案;
      let opts = '<div class="opts">';
      KEY.forEach(k=>{
        if(!(k in q.选项)) return;
        opts += '<label class="opt" data-k="'+k+'"><input type="radio" name="'+q.id+'" value="'+k+'">'+
                '<span class="k">'+k+'.</span><span>'+q.选项[k]+'</span></label>';
      });
      opts += '</div>';
      qd.innerHTML = '<div class="q-t"><i>Q'+(qi+1)+'</i>'+q.题干+'</div>'+opts+
        '<div class="fb" data-fb></div>';
      box.appendChild(qd);
    });
    quiz.appendChild(box);
  });
});

quiz.addEventListener("change", e=>{
  if(e.target.type!=="radio") return;
  const qd = e.target.closest(".q");
  qd.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  e.target.closest(".opt").classList.add("sel");
  updateBadge(qd.closest(".unit"));
});

function updateBadge(unitBox){
  const qs = [...unitBox.querySelectorAll(".q")];
  const done = qs.filter(q=>q.querySelector("input:checked")).length;
  const badge = unitBox.querySelector("[data-badge]");
  if(done===0){ badge.className="badge"; badge.textContent="未作答"; }
  else if(done<qs.length){ badge.className="badge"; badge.textContent=done+"/"+qs.length+" 作答中"; }
  else { badge.className="badge"; badge.textContent="待提交"; }
}

document.getElementById("reset").addEventListener("click", ()=>location.reload());

document.getElementById("submit").addEventListener("click", ()=>{
  const units = [];
  let answeredAll = true;
  document.querySelectorAll(".unit").forEach(unitBox=>{
    const qs = [...unitBox.querySelectorAll(".q")];
    let correct=0, answered=0;
    qs.forEach(q=>{
      const sel = q.querySelector("input:checked");
      const ans = q.dataset.answer;
      const fb = q.querySelector("[data-fb]");
      q.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));
      if(sel){
        answered++;
        const chosen = sel.value;
        if(chosen===ans){ correct++; sel.closest(".opt").classList.add("right"); }
        else {
          sel.closest(".opt").classList.add("wrong");
          q.querySelector('.opt[data-k="'+ans+'"]').classList.add("right");
        }
      } else {
        q.querySelector('.opt[data-k="'+ans+'"]').classList.add("right");
      }
      const data = DATA.模块.flatMap(m=>m.单元).find(u=>u.编号===unitBox.dataset.unit)
                    .题目.find(x=>x.id===q.dataset.qid);
      const ok = sel && sel.value===ans;
      fb.className = "fb show " + (ok?"right":"wrong");
      fb.innerHTML = ok
        ? "✔ 回答正确。考察点：" + data.考察概念
        : "✘ 正确答案：" + ans + "。考察点：" + data.考察概念 + "<br>说明：" + data.答错说明;
    });
    if(answered<qs.length) answeredAll=false;
    const pass = correct >= Math.ceil(qs.length*2/3);
    const badge = unitBox.querySelector("[data-badge]");
    badge.className = "badge " + (pass?"ok":"warn");
    badge.textContent = (pass?"✅ 可跳过 ":"📘 建议学习 ") + correct+"/"+qs.length;
    units.push({编号:unitBox.dataset.unit,
      名称:unitBox.querySelector(".unit-t").textContent.replace(unitBox.dataset.unit,"").trim(),
      正确:correct,题数:qs.length,pass});
  });

  const need = units.filter(u=>!u.pass).length;
  let advice;
  if(need>5) advice = "你有 <b>"+need+"</b> 个单元未达标，建议<b>完整学习本课程</b>，从头建立决策操作系统。";
  else if(need>=3) advice = "你有 <b>"+need+"</b> 个单元未达标，建议<b>按需补课</b>，优先补齐下方标记为『建议学习』的单元。";
  else if(need>=1) advice = "仅 <b>"+need+"</b> 个单元未达标，可<b>定向学习</b>这几个薄弱单元，其余可跳过。";
  else advice = "🎉 全部单元均已达标，你已具备本课程的核心认知，<b>可整体跳过</b>，或仅做兴趣性浏览。";

  const R = document.getElementById("result");
  const total = units.reduce((s,u)=>s+u.正确,0);
  const totalQ = units.reduce((s,u)=>s+u.题数,0);
  R.innerHTML =
    '<h2>诊断结果</h2>'+
    '<div class="score-top">总正确率：'+total+' / '+totalQ+'　（'+Math.round(total/totalQ*100)+'%）'+
      (answeredAll?"":"　⚠️ 存在未作答题目，已按答错计")+'</div>'+
    '<div class="bar"><i style="width:'+(total/totalQ*100)+'%"></i></div>'+
    '<div class="advice">'+advice+'</div>'+
    '<div class="rlist">'+units.map(u=>
      '<div class="ritem '+(u.pass?"ok":"warn")+'"><span class="n">'+u.编号+" "+u.名称+
      '</span><b>'+(u.pass?"可跳过":"建议学习")+' '+u.正确+"/"+u.题数+'</b></div>').join("")+'</div>';
  R.classList.add("show");
  R.scrollIntoView({behavior:"smooth"});
});
</script>
</body>
</html>
